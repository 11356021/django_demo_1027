<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選課系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'course_list' %}">選課系統</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'course_list' %}">可選課程</a>
            <a class="nav-link" href="{% url 'my_schedule' %}">我的課表</a>
            {% if user.is_staff %}<a class="nav-link" href="{% url 'admin:index' %}">管理後台</a>{% endif %}
        </div>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="navbar-text me-2">{{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm">登出</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">登入</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
