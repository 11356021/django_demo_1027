{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2>設定新密碼</h2>
        {% if validlink %}
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary">確認變更</button>
            </form>
        {% else %}
            <div class="alert alert-danger">
                此密碼重設連結無效，可能已經使用過或已過期。
            </div>
            <a href="{% url 'password_reset' %}" class="btn btn-primary">重新申請重設</a>
        {% endif %}
    </div>
</div>
{% endblock %}
