{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2>登入</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">登入</button>
        </form>
        <p class="mt-3">
            還沒有帳號？<a href="{% url 'register' %}">註冊</a>
            · <a href="{% url 'password_reset' %}">忘記密碼？</a>
        </p>
    </div>
</div>
{% endblock %}
