{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2>忘記密碼</h2>
        <p class="text-muted">請輸入註冊時填寫的 Email，我們會寄送密碼重設連結給您。</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">寄送重設信</button>
            <a href="{% url 'login' %}" class="btn btn-outline-secondary">返回登入</a>
        </form>
    </div>
</div>
{% endblock %}
